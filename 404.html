<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonny & Bright</title>
    <script>
      // GitHub Pages returns this file for unknown paths. Preserve the route
      // and return to the project root, where index.html restores it.
      const segmentsToKeep = 1;
      const locationParts = window.location;
      const basePath = locationParts.pathname
        .split('/')
        .slice(0, 1 + segmentsToKeep)
        .join('/');
      const route = locationParts.pathname
        .slice(1)
        .split('/')
        .slice(segmentsToKeep)
        .join('/')
        .replace(/&/g, '~and~');

      window.location.replace(
        `${locationParts.protocol}//${locationParts.host}${basePath}/?/${route}` +
          (locationParts.search ? `&${locationParts.search.slice(1).replace(/&/g, '~and~')}` : '') +
          locationParts.hash,
      );
    </script>
  </head>
  <body></body>
</html>
